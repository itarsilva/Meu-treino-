<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu Treino</title>
  <meta name="description" content="Acompanhe seus treinos, séries, cargas e evolução.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view"></main>

  <div id="timer" class="rest hidden" role="status" aria-live="polite">
    <svg class="rest-ring" viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15" class="rest-track"/>
      <circle cx="18" cy="18" r="15" class="rest-bar" id="timer-bar"/>
    </svg>
    <div class="rest-text">
      <span>Descanso</span>
      <strong id="timer-value">1:30</strong>
    </div>
    <button class="pill-btn" data-action="timer-add">+15s</button>
    <button class="pill-btn" data-action="timer-stop">Pular</button>
  </div>

  <nav class="tabbar" id="tabbar"></nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-group" id="sheet-body"></div>
      <button class="sheet-btn cancel" data-sheet="cancel">Cancelar</button>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="exercicios.js"></script>
  <script src="app.js"></script>
</body>
</html>
